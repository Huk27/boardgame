        <circle r="45" stroke="#ac794d" opacity=".7" stroke-width=".65"/>
        <use xlink:href="#sunRays"/><use xlink:href="#sunRays" transform="rotate(90)"/>
        <use xlink:href="#sunRays" transform="rotate(180)"/><use xlink:href="#sunRays" transform="rotate(270)"/>
        <circle r="24.4" fill="#9a5b3a" stroke="#fff2c4" stroke-width="1.2"/>

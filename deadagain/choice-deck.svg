      <path d="M10 141q15-10 30-8t26-2q12-7 24-6t26-3q17-5 36-1" stroke="#749787" opacity=".7"/>
      <use xlink:href="#nightCity"/><use xlink:href="#nightCity" transform="translate(160 0) scale(-1 1)"/>
      <path d="M56 154q9-14 23-20v-12h2v12q13 6 23 20" fill="#326266" stroke="#b4b796" stroke-width=".8"/>
      <path d="M64 151q8-10 16-14 10 4 16 14m-24-2 8-10 8 10" stroke="#b3b999" stroke-width=".9"/>
      <use xlink:href="#base" fill="#193538"/><use xlink:href="#baseTrim"/>

        <use xlink:href="#star" transform="translate(91 64) scale(.78)"/>
        <use xlink:href="#star" transform="translate(109 86) scale(.42)"/>
        <use xlink:href="#star" transform="translate(41 67) scale(.45)"/>
        <use xlink:href="#star" transform="translate(125 98) scale(.55)"/>
        <use xlink:href="#star" transform="translate(53 103) scale(.45)"/>
        <circle cx="110" cy="73" r="1.2"/><circle cx="58" cy="52" r="1.2"/>
        <circle cx="99" cy="91" r="1.1"/><circle cx="35" cy="87" r="1.2"/>
        <circle cx="92" cy="35" r="1"/><circle cx="31" cy="53" r="1.1"/>
      </g>
      <path d="m91 64 14-15 5 24-11 18" stroke="#a5aa87" stroke-width=".6" stroke-dasharray="2 3"/>
      <path d="M85 49a31.5 31.5 0 1 0 23 46.5A29.8 29.8 0 0 1 85 49Z" fill="#102f36" stroke="#243e43" stroke-width="3"/>
      <path d="M83.5 49a31 31 0 1 0 23 46.2A30 30 0 0 1 83.5 49Z" fill="url(#moon)" stroke="#ede6b4" stroke-width=".9"/>

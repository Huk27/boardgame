        <path d="M-16 5c6 6 20 8 32 1m-29 5c7 5 15 6 24 2m-17 3.8 6 .9" stroke="#9b613b" opacity=".8" stroke-width="1"/>
        <path d="M-17-2a18 18 0 0 1 14-15" stroke="#ffefb0" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <use xlink:href="#city"/><use xlink:href="#city" transform="translate(160 0) scale(-1 1)"/>
      <path d="M30 167q14-20 38-30l12-14 12 14q24 10 38 30" fill="#ad7850"/>
      <path d="m56 153 14-16 10-13 10 13 14 16M64 151l16-24 16 24m-23-4 7-15 7 15" stroke="#f3d09a" stroke-width="1"/>

      <circle cx="80" cy="112" r="8.7" fill="#453139" stroke="#c7a574"/>
      <path d="m80 104 3 8-3 8-3-8z" fill="#eacf94"/>
      <path d="m80 28 2 4-2 4-2-4zm0 160 2 4-2 4-2-4zM24 111l3-2 3 2-3 2zm106 0 3-2 3 2-3 2z" fill="#f4d699"/>

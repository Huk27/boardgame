      <g stroke="#b27d4a" opacity=".57" stroke-width=".8">
        <path d="M80 80 44 13m36 67L22 26m58 54L8 42m72 38L8 66m72 14L8 91m72-11L8 111m72-31 36-67M80 80l58-54M80 80l72-38M80 80l72-14M80 80l72 11M80 80l72 31"/>
        <path d="M80 22v14m-9-12 2 11m16-11-2 11"/>

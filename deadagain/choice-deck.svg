    <linearGradient id="night" x2="1" y2="1">
      <stop stop-color="#172e37"/><stop offset=".45" stop-color="#095154"/>
      <stop offset=".72" stop-color="#163b42"/><stop offset="1" stop-color="#11262e"/>
    </linearGradient>
    <radialGradient id="sun" cx=".43" cy=".3" r=".75">
      <stop stop-color="#fff7cd"/><stop offset=".5" stop-color="#f3c36d"/>
      <stop offset=".79" stop-color="#db9446"/><stop offset="1" stop-color="#894a2c"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" x2="1" y1="0" y2="1">

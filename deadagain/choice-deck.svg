<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="224" viewBox="0 0 480 224" fill="none">
  <defs>
    <linearGradient id="brass" x2=".86" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#bc8a50"/><stop offset=".18" stop-color="#fce3a0"/>
      <stop offset=".39" stop-color="#a07849"/><stop offset=".6" stop-color="#eaca88"/>
